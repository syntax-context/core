# SYNTAX keeps no record of visits: no access log (not-knowing, personal_projects/CLAUDE.md).
server {
    listen 80;
    root /usr/share/nginx/html;
    access_log off;
    # 13 November 2026: the small model syntax is now the narrow small model syntax, and its builder is ungli on its own host.
    location ~ ^/small-model/builder/?(.*)$ { return 308 https://ungli.syntax.prayasabhinav.net/$1; }
    location ~ ^/small-model(/.*)?$ { return 308 https://syntax.prayasabhinav.net/narrow-small-model$1; }
    location = /small-model.json { return 308 https://syntax.prayasabhinav.net/narrow-small-model.json; }
    location = /og/small-model.png { return 308 https://syntax.prayasabhinav.net/og/narrow-small-model.png; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.json$ { default_type application/json; }
}
