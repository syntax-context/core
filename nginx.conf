# SYNTAX keeps no record of visits: no access log (not-knowing, personal_projects/CLAUDE.md).
server {
    listen 80;
    root /usr/share/nginx/html;
    access_log off;
    # 13 November 2026: the small model syntax is now the narrow small model syntax, and its builder is ungli on its own host.
    location ~ ^/small-model/builder/?(.*)$ { return 308 https://ungli.syntax.prayasabhinav.net/$1; }
    location ~ ^/(small-model|narrow-small-model)(/.*)?$ { return 308 https://syntax.prayasabhinav.net/nsm$2; }
    location ~ ^/(small-model|narrow-small-model)\.json$ { return 308 https://syntax.prayasabhinav.net/nsm.json; }
    location ~ ^/og/(small-model|narrow-small-model)\.png$ { return 308 https://syntax.prayasabhinav.net/og/nsm.png; }
    # 13 November 2026: Bairang is the band described in the band syntax, no longer a page of its own here.
    location ~ ^/bairang/?$ { return 308 https://syntax.prayasabhinav.net/band/; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }   # a browser checks for a newer page each time, so a change shows at once (13 November 2026)
    location ~ \.json$ { default_type application/json; }
}
